<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css
">
    <title>Biblioteca Universitaria</title>
</head>

<body>

    <main>
        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css
">
            <title>Biblioteca Universitaria</title>
        </head>

        <body>

            <main>
                <nav class="navbar bg-dark">
                    <div class="container-fluid">
                        <a class="navbar-brand text-white" href="#">
                            <img src="/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24"
                                class="d-inline-block align-text-top">
                            Biblioteca Universitária
                        </a>
                    </div>
                </nav>


                <section class="Resumo text-center py-5">
                    <h1 class="display-5 fw-bold">Bem-vindo à Biblioteca Universitária!</h1>
                    <p class="lead text-secondary">
                        Explore nosso acervo, descubra novas histórias e encontre os livros
                        que vão acompanhar sua jornada de conhecimento.
                    </p>
                </section>


                <form>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Nome do Livro</label>
                        <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Nome do Autor</label>
                        <input type="text" class="form-control" id="exampleInputPassword1">
                    </div>
                    <button type="submit" class="btn btn-primary ms-3 mb-3">Submit</button>
                </form>




                <div class="card" style="width: 18rem;">
                    <div class="card-body">
                        <h5 class="card-title">Livros</h5>
                        <p class="card-text">
                            Consulte e gerencie os livros disponíveis em nossa biblioteca.
                        </p>

                        <a href="#" class="btn btn-primary">Editar</a>
                        <button type="button" class="btn btn-danger ms-2">Excluir</button>

                    </div>
                </div>




            </main>
        </body>

        </html>
    </main>
</body>

</html>
